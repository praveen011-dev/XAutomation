services:
  - type: web
    name: xpost-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run ui
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: XPOST_UI_HOST
        value: 0.0.0.0
      - key: XPOST_UI_PASSWORD
        sync: false
      - key: XPOST_UI_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: X_API_KEY
        sync: false
      - key: X_API_KEY_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: XPOST_MANUAL
        value: "0"
